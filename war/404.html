<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | LV Labs</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="./favicon.svg">
  <style>
    :root {
      color-scheme: dark;
      --bg: #171717;
      --surface: #262626;
      --border: #3f3f46;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #eca065;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(236, 160, 101, 0.18), transparent 35%),
        linear-gradient(180deg, #1a1a1a 0%, var(--bg) 100%);
      color: var(--text);
      font-family: "Geist Mono", "IBM Plex Mono", "SFMono-Regular", "SF Mono", "Cascadia Mono",
        "Roboto Mono", "Menlo", "Monaco", "Liberation Mono", monospace;
      padding: 24px;
    }

    main {
      width: min(560px, 100%);
      border: 1px solid var(--border);
      background: rgba(38, 38, 38, 0.92);
      padding: 32px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page doesn’t exist.</p>
    <p><a href="/circuitjs.html">Open the circuit simulator</a></p>
  </main>
</body>
</html>
